# Minimal EU868 region for the evaluation ChirpStack UI (OIDC probe).

[[regions]]
  id = "eu868"
  description = "EU868 eval"
  common_name = "EU868"

  [regions.gateway]
    force_gws_private = false

  [regions.network]
    installation_margin = 10
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    rx2_dr = 0
    rx2_frequency = 869525000
    downlink_tx_power = -1
    scheduler_interval = "1s"

  [[regions.uplink_channels]]
    frequency = 868100000
    min_dr = 0
    max_dr = 5
