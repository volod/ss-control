services:
  authelia:
    image: ${AUTHELIA_IMAGE}
    volumes:
      - ${EVAL_AUTHELIA_DIR}:/config
    networks: [eval]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  chirpstack:
    depends_on:
      authelia:
        condition: service_healthy
