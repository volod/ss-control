# ss-control production compose. Only Caddy publishes host ports (80 and 443).
name: ss-control

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  control:
    name: ${SS_CONTROL_NETWORK:-ss-control}

services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "${SS_CONTROL_BIND:-0.0.0.0}:${SS_CONTROL_HTTP_PORT:-80}:80"
      - "${SS_CONTROL_BIND:-0.0.0.0}:${SS_CONTROL_HTTPS_PORT:-443}:443"
    environment:
      SS_CONTROL_DOMAIN: ${SS_CONTROL_DOMAIN:-ss-control.test}
      SS_VIDEO_UI_UPSTREAM: ${SS_VIDEO_UI_UPSTREAM:-upstream-stub:8080}
      FRIGATE_UPSTREAM: ${FRIGATE_UPSTREAM:-upstream-stub:8080}
      CHIRPSTACK_UPSTREAM: ${CHIRPSTACK_UPSTREAM:-upstream-stub:8080}
      FUSION_UPSTREAM: ${FUSION_UPSTREAM:-upstream-stub:8080}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SS_CONTROL_DATA}/certs/caddy.crt:/etc/caddy/certs/caddy.crt:ro
      - ${SS_CONTROL_DATA}/certs/caddy.key:/etc/caddy/certs/caddy.key:ro
    networks:
      control:
        aliases:
          - grafana.${SS_CONTROL_DOMAIN:-ss-control.test}
          - auth.${SS_CONTROL_DOMAIN:-ss-control.test}
          - nodered.${SS_CONTROL_DOMAIN:-ss-control.test}
          - chirpstack.${SS_CONTROL_DOMAIN:-ss-control.test}
          - video.${SS_CONTROL_DOMAIN:-ss-control.test}
          - frigate.${SS_CONTROL_DOMAIN:-ss-control.test}
          - fusion.${SS_CONTROL_DOMAIN:-ss-control.test}
          - prometheus.${SS_CONTROL_DOMAIN:-ss-control.test}
          - registry.${SS_CONTROL_DOMAIN:-ss-control.test}
    depends_on:
      authelia:
        condition: service_healthy
      grafana:
        condition: service_started
      nodered:
        condition: service_started
      upstream-stub:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_CADDY_CPUS:-0.25}"
          memory: ${SS_CONTROL_CADDY_MEMORY:-128M}
        reservations:
          cpus: "0.05"
          memory: 32M

  authelia:
    image: ${AUTHELIA_IMAGE}
    restart: unless-stopped
    volumes:
      - ${SS_CONTROL_DATA}/authelia:/config
    networks: [control]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_AUTHELIA_CPUS:-0.25}"
          memory: ${SS_CONTROL_AUTHELIA_MEMORY:-128M}
        reservations:
          cpus: "0.05"
          memory: 32M

  step-ca:
    image: ${STEP_CA_IMAGE}
    restart: unless-stopped
    environment:
      DOCKER_STEPCA_INIT_NAME: ss-control
      DOCKER_STEPCA_INIT_DNS_NAMES: step-ca,localhost,mosquitto,caddy
      DOCKER_STEPCA_INIT_PASSWORD: ${STEP_CA_PASSWORD}
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: ${STEP_PROVISIONER}
    volumes:
      - ${SS_CONTROL_DATA}/step-ca:/home/step
    networks: [control]
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_STEPCA_CPUS:-0.25}"
          memory: ${SS_CONTROL_STEPCA_MEMORY:-128M}
        reservations:
          cpus: "0.05"
          memory: 32M

  mosquitto:
    image: ${MOSQUITTO_IMAGE}
    restart: unless-stopped
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${SS_CONTROL_DATA}/certs:/mosquitto/certs:ro
    networks: [control]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_MOSQUITTO_CPUS:-0.15}"
          memory: ${SS_CONTROL_MOSQUITTO_MEMORY:-128M}
        reservations:
          cpus: "0.05"
          memory: 32M

  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: SSO
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OIDC_AUTH_URL}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${OIDC_TOKEN_URL}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${OIDC_USERINFO_URL}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admins') && 'Admin' || 'Editor'"
      GF_LOG_LEVEL: info
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${SS_CONTROL_DATA}/grafana:/var/lib/grafana
    networks: [control]
    depends_on:
      authelia:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_GRAFANA_CPUS:-0.50}"
          memory: ${SS_CONTROL_GRAFANA_MEMORY:-256M}
        reservations:
          cpus: "0.05"
          memory: 64M

  nodered:
    build:
      context: ./docker/nodered
    image: ss-control-nodered:local
    restart: unless-stopped
    environment:
      PORT: "1880"
      NODERED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET}
      OIDC_ISSUER: ${NODERED_OIDC_ISSUER}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL}
      OIDC_CLIENT_ID: nodered
      OIDC_CLIENT_SECRET: ${NODERED_CLIENT_SECRET}
      OIDC_CALLBACK_URL: ${NODERED_CALLBACK_URL}
      NODE_EXTRA_CA_CERTS: /certs/root_ca.crt
    volumes:
      - ${SS_CONTROL_DATA}/nodered:/data
      - ./config/nodered/settings.js:/data/settings.js:ro
      - ${SS_CONTROL_DATA}/certs/root_ca.crt:/certs/root_ca.crt:ro
    networks: [control]
    depends_on:
      authelia:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1880/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_NODERED_CPUS:-0.50}"
          memory: ${SS_CONTROL_NODERED_MEMORY:-256M}
        reservations:
          cpus: "0.05"
          memory: 64M

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SS_CONTROL_DATA}/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks: [control]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_PROMETHEUS_CPUS:-0.25}"
          memory: ${SS_CONTROL_PROMETHEUS_MEMORY:-256M}
        reservations:
          cpus: "0.05"
          memory: 64M

  cadvisor:
    image: ${CADVISOR_IMAGE}
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [control]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_CADVISOR_CPUS:-0.15}"
          memory: ${SS_CONTROL_CADVISOR_MEMORY:-128M}
        reservations:
          cpus: "0.05"
          memory: 32M

  upstream-stub:
    build:
      context: ./docker/stub
    image: ss-control-stub:local
    restart: unless-stopped
    networks: [control]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${SS_CONTROL_STUB_CPUS:-0.10}"
          memory: ${SS_CONTROL_STUB_MEMORY:-64M}
        reservations:
          cpus: "0.02"
          memory: 16M
